<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nido 🪺" />
  <meta name="theme-color" content="#C2185B" />
  <title>Nido 🪺</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>

  <style>
    /* ══════════════════════════════════════
       RESET
    ══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #FFF0F5;
      color: #2D1B2E;
    }

    /* ══════════════════════════════════════
       VARIABLES
    ══════════════════════════════════════ */
    :root {
      /* Rosa principal */
      --rose:        #C2185B;
      --rose-dark:   #880E4F;
      --rose-mid:    #E91E8C;
      --rose-light:  #F48FB1;
      --rose-pale:   #FCE4EC;
      --rose-ghost:  #FFF0F5;

      /* Crema / neutros cálidos */
      --cream:       #FFF8F0;
      --warm-white:  #FFFFFF;
      --text:        #2D1B2E;
      --text-muted:  #8B6572;
      --border:      #F8BBD9;

      /* Shadows */
      --shadow:       0 2px 16px rgba(194,24,91,.10);
      --shadow-lg:    0 6px 28px rgba(194,24,91,.18);

      /* Radios */
      --r:   16px;
      --r-sm: 10px;

      /* Layout */
      --nav-h:    68px;
      --safe-b:   env(safe-area-inset-bottom, 0px);
    }

    /* ══════════════════════════════════════
       SCROLLABLE PAGE
    ══════════════════════════════════════ */
    .page {
      height: calc(100dvh - var(--nav-h) - var(--safe-b));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px 32px;
    }

    /* ══════════════════════════════════════
       CARDS
    ══════════════════════════════════════ */
    .card {
      background: var(--warm-white);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ══════════════════════════════════════
       GRADIENT CARDS
    ══════════════════════════════════════ */
    .grad-card {
      background: linear-gradient(135deg, var(--rose-dark) 0%, var(--rose) 55%, var(--rose-mid) 100%);
      border-radius: var(--r);
      padding: 22px 20px;
      margin-bottom: 14px;
      color: #fff;
    }

    /* ══════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════ */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--rose), var(--rose-mid));
      border: none;
      border-radius: var(--r-sm);
      padding: 15px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity .15s, transform .15s;
      box-shadow: 0 4px 16px rgba(194,24,91,.3);
    }
    .btn-primary:active { opacity: .85; transform: scale(.98); }
    .btn-primary:disabled { opacity: .45; }

    .btn-ghost {
      background: var(--rose-ghost);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--rose);
      cursor: pointer;
    }

    /* ══════════════════════════════════════
       PROGRESS BAR
    ══════════════════════════════════════ */
    .progress-wrap {
      background: var(--rose-pale);
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--rose), var(--rose-mid));
      border-radius: 99px;
      transition: width .7s cubic-bezier(.34,1.56,.64,1);
    }

    /* ══════════════════════════════════════
       FORM INPUTS
    ══════════════════════════════════════ */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      background: var(--warm-white);
      color: var(--text);
      outline: none;
      appearance: none;
      transition: border-color .15s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--rose); }

    /* ══════════════════════════════════════
       CHIPS / PILLS
    ══════════════════════════════════════ */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--rose-ghost);
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .chip.active { background: var(--rose-pale); border-color: var(--rose); color: var(--rose); }

    /* ══════════════════════════════════════
       EMPTY STATE
    ══════════════════════════════════════ */
    .empty {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
    }
    .empty .ei { font-size: 36px; margin-bottom: 8px; }
    .empty p { font-size: 13px; line-height: 1.5; }

    /* ══════════════════════════════════════
       STATS ROW
    ══════════════════════════════════════ */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: var(--warm-white);
      border-radius: var(--r-sm);
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-val { font-size: 22px; font-weight: 700; color: var(--rose); }
    .stat-lbl { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }

    /* ══════════════════════════════════════
       FEED ITEMS
    ══════════════════════════════════════ */
    .feed-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .feed-item:last-child { border-bottom: none; }
    .feed-av {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .feed-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .feed-desc { font-size: 13px; color: var(--text-muted); margin-top: 1px; }
    .feed-time { font-size: 11px; color: var(--text-muted); margin-left: auto; flex-shrink: 0; padding-top: 2px; }

    /* ══════════════════════════════════════
       SAVINGS LIST
    ══════════════════════════════════════ */
    .save-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .save-item:last-child { border-bottom: none; }
    .save-left { display: flex; align-items: center; gap: 10px; }
    .save-av { font-size: 20px; }
    .save-name { font-size: 13px; font-weight: 600; }
    .save-meta { font-size: 12px; color: var(--text-muted); }
    .save-amount { font-size: 15px; font-weight: 700; color: #2E7D32; }

    /* ══════════════════════════════════════
       VS CARD (RETOS)
    ══════════════════════════════════════ */
    .vs-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0;
    }
    .vs-player { flex: 1; text-align: center; }
    .vs-player-em { font-size: 38px; margin-bottom: 4px; }
    .vs-player-name { font-size: 12px; font-weight: 600; opacity: .85; }
    .vs-player-score { font-size: 48px; font-weight: 700; line-height: 1; margin-top: 4px; }
    .vs-sep { font-size: 16px; opacity: .45; }
    .vs-banner {
      background: rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 8px;
    }

    /* ══════════════════════════════════════
       SCORE BREAKDOWN
    ══════════════════════════════════════ */
    .score-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .score-row:last-child { border-bottom: none; }
    .score-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
    .score-lbl { font-size: 13px; color: var(--text-muted); flex: 1; }
    .score-pts { font-size: 14px; font-weight: 700; color: var(--rose); }

    /* ══════════════════════════════════════
       PROFILE CARDS
    ══════════════════════════════════════ */
    .profile-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .profile-mini {
      background: var(--warm-white);
      border-radius: var(--r);
      padding: 18px 14px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .pm-av { font-size: 34px; margin-bottom: 6px; }
    .pm-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .pm-score { font-size: 26px; font-weight: 700; color: var(--rose); }
    .pm-lbl { font-size: 10px; color: var(--text-muted); }

    /* ══════════════════════════════════════
       SPARK ITEMS
    ══════════════════════════════════════ */
    .spark-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      background: linear-gradient(135deg, rgba(194,24,91,.05), rgba(233,30,140,.05));
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .spark-from { font-size: 18px; }
    .spark-msg { font-size: 13px; color: var(--text); flex: 1; }
    .spark-time { font-size: 11px; color: var(--text-muted); }

    /* ══════════════════════════════════════
       CONFIG ROWS
    ══════════════════════════════════════ */
    .cfg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .cfg-row:last-child { border-bottom: none; }
    .cfg-lbl { font-size: 15px; font-weight: 600; }
    .cfg-val { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* ══════════════════════════════════════
       BOTTOM SHEET
    ══════════════════════════════════════ */
    #sheet-wrap {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
    }
    #sheet-wrap.open { display: block; }
    .sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(45,27,46,.45);
      backdrop-filter: blur(5px);
    }
    .sheet-body {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--warm-white);
      border-radius: 24px 24px 0 0;
      padding: 16px 20px calc(24px + var(--safe-b));
      max-height: 88dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-handle {
      width: 38px; height: 4px;
      background: var(--border);
      border-radius: 99px;
      margin: 0 auto 18px;
    }
    .sheet-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 18px; }

    /* Log type selector */
    .log-opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .log-opt {
      background: var(--rose-ghost);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
    }
    .log-opt.sel { border-color: var(--rose); background: var(--rose-pale); }
    .log-opt .lo-icon { font-size: 26px; margin-bottom: 5px; }
    .log-opt .lo-name { font-size: 13px; font-weight: 600; color: var(--text); }

    /* Habit grid */
    .habit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }
    .habit-chip {
      background: var(--rose-ghost);
      border: 2px solid var(--border);
      border-radius: 11px;
      padding: 11px 6px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
    }
    .habit-chip.sel { border-color: var(--rose); background: var(--rose-pale); }
    .hc-icon { font-size: 22px; margin-bottom: 3px; }
    .hc-name { font-size: 10px; font-weight: 600; color: var(--text-muted); }

    /* Spark preset buttons */
    .spark-preset {
      width: 100%;
      background: var(--rose-ghost);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 8px;
      display: block;
    }
    .spark-preset:active { background: var(--rose-pale); border-color: var(--rose); }

    /* ══════════════════════════════════════
       SPLASH SCREEN
    ══════════════════════════════════════ */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #880E4F 0%, #C2185B 45%, #E91E8C 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 40px 24px;
    }
    .splash-nest { font-size: 76px; margin-bottom: 10px; animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
    .splash-title { font-size: 44px; font-weight: 700; color: #fff; letter-spacing: -1.5px; margin-bottom: 6px; }
    .splash-sub { font-size: 15px; color: rgba(255,255,255,.78); margin-bottom: 52px; text-align: center; }
    .splash-who { font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 18px; }
    .user-cards { display: flex; gap: 14px; width: 100%; max-width: 280px; }
    .user-card-btn {
      flex: 1;
      background: rgba(255,255,255,.15);
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 20px;
      padding: 22px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      color: #fff;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all .2s;
    }
    .user-card-btn:active { transform: scale(.95); background: rgba(255,255,255,.25); }
    .user-card-btn .uc-av { font-size: 38px; }

    /* ══════════════════════════════════════
       BOTTOM NAV
    ══════════════════════════════════════ */
    #bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: var(--warm-white);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }
    .nav-btn {
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 8px 0 0;
      background: none; border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 9px; font-weight: 600;
      letter-spacing: .03em; text-transform: uppercase;
      transition: color .15s;
    }
    .nav-btn .ni { font-size: 20px; line-height: 1; }
    .nav-btn.active { color: var(--rose); }
    /* FAB flotante (esquina inferior derecha) */
    .log-fab {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
      right: 18px;
      width: 54px; height: 54px;
      background: linear-gradient(135deg, var(--rose), var(--rose-mid));
      border-radius: 18px; border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(194,24,91,.45);
      z-index: 50;
      transition: transform .15s;
    }
    .log-fab:active { transform: scale(.93); }

    /* Sub-tabs (chips horizontales dentro de cada sección) */
    .sub-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 0 10px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab {
      flex-shrink: 0;
      background: var(--rose-ghost);
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 7px 16px;
      font-size: 13px; font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .sub-tab.active {
      background: var(--rose-pale);
      border-color: var(--rose);
      color: var(--rose);
    }

    /* PAGE HEADER */
    .page-header {
      padding: 18px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }

    /* ══════════════════════════════════════
       TOAST
    ══════════════════════════════════════ */
    #toast {
      position: fixed;
      top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-110px);
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: 99px;
      font-size: 14px; font-weight: 600;
      z-index: 500;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      text-align: center;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.ok  { background: #388E3C; }
    #toast.hot { background: linear-gradient(135deg, var(--rose), var(--rose-mid)); }

    /* ══════════════════════════════════════
       ANIMATIONS
    ══════════════════════════════════════ */
    @keyframes pop {
      0%   { transform: scale(.4); opacity: 0; }
      100% { transform: scale(1);  opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    .fade-up { animation: fadeUp .3s ease forwards; }

    /* ══════════════════════════════════════
       SHEET ANIMATION
    ══════════════════════════════════════ */
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0);    }
    }
    .sheet-body { animation: slideUp .28s cubic-bezier(.32,.72,0,1); }

    /* ══════════════════════════════════════
       CARD ACTIVE (feedback táctil)
    ══════════════════════════════════════ */
    .card:active { transform: scale(.99); }

    /* ══════════════════════════════════════
       SYNC DOT (punto verde de conexión)
    ══════════════════════════════════════ */
    .sync-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: syncPulse 2s infinite;
      flex-shrink: 0;
    }
    .sync-dot.off { background: #94a3b8; animation: none; }
    @keyframes syncPulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
      70%  { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }

    /* ══════════════════════════════════════
       LOADING SCREEN
    ══════════════════════════════════════ */
    #loading-screen {
      position: fixed; inset: 0;
      background: linear-gradient(160deg, #880E4F 0%, #C2185B 45%, #E91E8C 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999;
      gap: 20px;
    }
    #loading-screen.hidden { display: none; }
    .loader-nest { font-size: 52px; animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
    .loader-spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loader-text { font-size: 14px; color: rgba(255,255,255,.75); font-weight: 600; font-family: 'Inter', sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-retry {
      background: rgba(255,255,255,.2);
      border: 1.5px solid rgba(255,255,255,.4);
      border-radius: 12px;
      padding: 10px 22px;
      color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; display: none;
    }

    /* ══════════════════════════════════════
       METAS LIBRES
    ══════════════════════════════════════ */
    .goal-card {
      background: var(--warm-white);
      border-radius: var(--r);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      border-left: 4px solid var(--rose);
    }
    .goal-card.done { border-left-color: #388E3C; opacity: .75; }
    .goal-icon { font-size: 28px; margin-bottom: 6px; }
    .goal-name { font-size: 15px; font-weight: 700; }
    .goal-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .goal-type-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 14px;
    }
    .goal-type-btn {
      background: var(--rose-ghost);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer; transition: all .15s;
      font-size: 13px; font-weight: 600;
      color: var(--text-muted);
    }
    .goal-type-btn.sel { border-color: var(--rose); background: var(--rose-pale); color: var(--rose); }

    /* ══════════════════════════════════════
       AGENDA
    ══════════════════════════════════════ */
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 4px; margin-bottom: 14px;
    }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      cursor: pointer; position: relative;
    }
    .cal-day.today { background: var(--rose); color: #fff; }
    .cal-day.has-event::after {
      content: ''; position: absolute; bottom: 3px;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--rose-mid);
    }
    .cal-day.today.has-event::after { background: #fff; }
    .cal-day.other-month { opacity: .3; }
    .cal-hdr { font-size: 10px; font-weight: 700; text-align: center; color: var(--text-muted); text-transform: uppercase; }

    /* ══════════════════════════════════════
       PENDIENTES JUNTOS
    ══════════════════════════════════════ */
    .pending-card {
      background: var(--warm-white);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
    }
    .pending-icon { font-size: 30px; flex-shrink: 0; }
    .pending-name { font-size: 14px; font-weight: 700; }
    .pending-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pending-status {
      margin-left: auto; flex-shrink: 0;
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 99px;
    }
    .status-want  { background: var(--rose-pale); color: var(--rose); }
    .status-booked { background: #FFF9C4; color: #F9A825; }
    .status-done  { background: #E8F5E9; color: #388E3C; }

    /* ══════════════════════════════════════
       DIARIO DEL NIDO
    ══════════════════════════════════════ */
    .memory-card {
      background: var(--warm-white);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .memory-img {
      width: 100%; height: 180px;
      object-fit: cover; display: block;
    }
    .memory-body { padding: 14px 16px; }
    .memory-title { font-size: 15px; font-weight: 700; }
    .memory-text { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
    .memory-footer { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--text-muted); }

    /* ══════════════════════════════════════
       RETO FÍSICO
    ══════════════════════════════════════ */
    .fitness-vs {
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 8px; align-items: center; margin: 12px 0;
    }
    .fitness-player { text-align: center; }
    .fitness-score { font-size: 36px; font-weight: 800; line-height: 1; }
    .fitness-name  { font-size: 12px; font-weight: 600; opacity: .8; margin-top: 4px; }
    .fitness-sep   { font-size: 14px; opacity: .4; font-weight: 700; }
    .metric-row {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .metric-row:last-child { border-bottom: none; }
    .metric-icon { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
    .metric-lbl  { font-size: 13px; color: var(--text-muted); flex: 1; margin-left: 8px; }
    .metric-vals { display: flex; gap: 12px; align-items: center; }
    .metric-val  { font-size: 14px; font-weight: 700; min-width: 44px; text-align: right; }
    .metric-winner { font-size: 14px; }

    /* Mini chart (SVG sparkline) */
    .sparkline-wrap { overflow-x: auto; padding-bottom: 4px; }

    /* ══════════════════════════════════════
       LOGROS (ACHIEVEMENTS)
    ══════════════════════════════════════ */
    .achievement-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .achievement-card {
      background: var(--warm-white);
      border-radius: var(--r);
      padding: 16px 12px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      transition: all .2s;
    }
    .achievement-card.unlocked {
      border-color: #FFD700;
      background: linear-gradient(135deg, #FFFDE7, #FFF8E1);
    }
    .achievement-card.locked { opacity: .45; filter: grayscale(.6); }
    .ach-icon { font-size: 32px; margin-bottom: 6px; }
    .ach-name { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .ach-desc { font-size: 10px; color: var(--text-muted); line-height: 1.4; }
    .ach-date { font-size: 10px; color: #B8860B; font-weight: 600; margin-top: 4px; }

    /* ══════════════════════════════════════
       NOTAS SECRETAS
    ══════════════════════════════════════ */
    .note-card {
      background: linear-gradient(135deg, #FFF0F5, #FCE4EC);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      padding: 18px;
      margin-bottom: 10px;
      position: relative;
    }
    .note-ribbon {
      position: absolute; top: 12px; right: 12px;
      font-size: 10px; font-weight: 700;
      background: var(--rose-pale); color: var(--rose);
      padding: 3px 8px; border-radius: 99px;
    }
    .note-msg { font-size: 14px; line-height: 1.6; color: var(--text); }
    .note-from { font-size: 11px; color: var(--text-muted); margin-top: 8px; }

    /* ══════════════════════════════════════
       HÁBITOS MEJORADOS
    ══════════════════════════════════════ */
    .habit-goal-card {
      background: var(--warm-white);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
    }
    .habit-goal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .habit-goal-icon { font-size: 22px; }
    .habit-goal-name { font-size: 14px; font-weight: 700; flex: 1; }
    .habit-goal-pct { font-size: 14px; font-weight: 800; color: var(--rose); }
    .habit-days {
      display: flex; gap: 5px; margin-top: 6px;
    }
    .habit-day {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      background: var(--rose-ghost); border: 1.5px solid var(--border);
      color: var(--text-muted);
    }
    .habit-day.done { background: var(--rose-pale); border-color: var(--rose); color: var(--rose); }
    .habit-day.today { border-color: var(--rose-mid); font-weight: 800; }

    /* ══════════════════════════════════════
       JUGAR — Temas y Retos
    ══════════════════════════════════════ */
    #map-container {
      display: none;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <div class="splash-nest">🪺</div>
    <div class="splash-title">Nido</div>
    <div class="splash-sub">El nido de Alonso y Lila 💕</div>
    <div class="splash-who">¿Quién eres?</div>
    <div class="user-cards">
      <button class="user-card-btn" onclick="selectUser('alonso')">
        <div class="uc-av">👨</div>
        <span>Alonso</span>
      </button>
      <button class="user-card-btn" onclick="selectUser('lila')">
        <div class="uc-av">👩</div>
        <span>Lila</span>
      </button>
    </div>
  </div>

  <!-- Loading screen (aparece mientras boot() carga datos) -->
  <div id="loading-screen" class="hidden">
    <div class="loader-nest">🪺</div>
    <div class="loader-spinner"></div>
    <div class="loader-text" id="loader-msg">Cargando Nido...</div>
    <button class="loader-retry" id="loader-retry" onclick="location.reload()">Reintentar</button>
  </div>

  <!-- App shell -->
  <div id="app" style="display:none">
    <div id="tab-content"></div>

    <!-- FAB flotante -->
    <button class="log-fab" id="main-fab" onclick="openSmartLog()">➕</button>

    <nav id="bottom-nav">
      <button class="nav-btn active" id="nav-hoy"    onclick="switchTab('hoy')">
        <span class="ni">🏠</span><span>HOY</span>
      </button>
      <button class="nav-btn" id="nav-metas"  onclick="switchTab('metas')">
        <span class="ni">🎯</span><span>METAS</span>
      </button>
      <button class="nav-btn" id="nav-vida"   onclick="switchTab('vida')">
        <span class="ni">🌸</span><span>VIDA</span>
      </button>
      <button class="nav-btn" id="nav-cuerpo" onclick="switchTab('cuerpo')">
        <span class="ni">💪</span><span>CUERPO</span>
      </button>
      <button class="nav-btn" id="nav-nido"   onclick="switchTab('nido')">
        <span class="ni">🪺</span><span>NIDO</span>
      </button>
      <button class="nav-btn" id="nav-jugar"  onclick="switchTab('jugar')">
        <span class="ni">🎲</span><span>JUGAR</span>
      </button>
    </nav>
  </div>

  <!-- Bottom Sheet -->
  <div id="sheet-wrap">
    <div class="sheet-overlay" onclick="closeSheet()"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
  /* ═══════════════════════════════════════════════════
     CONFIG
  ═══════════════════════════════════════════════════ */
  const CFG = {
    SUPABASE_URL: 'https://dbhtnlepjmgdugwpgcbb.supabase.co',
    SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiaHRubGVwam1nZHVnd3BnY2JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDY0OTEsImV4cCI6MjEwMjIyMjQ5MX0.1VCN9jLq7NJLVEHZIQyA7ycEgXucHxJXLttsWkAJutw',

    USERS: {
      alonso: { id:'alonso', name:'Alonso', emoji:'👨', bg:'#E8EAF6', color:'#3949AB' },
      lila:   { id:'lila',   name:'Lila',   emoji:'👩', bg:'#FCE4EC', color:'#C2185B' }
    },

    GOALS: {
      europa: { id:'europa', icon:'✈️', name:'Viaje a Europa', target:null },
      perro:  { id:'perro',  icon:'🐾', name:'Nuestro perro', target:15000, targetMax:28000 }
    },

    HABITS: [
      { id:'gym',     icon:'💪', name:'Ejercicio'  },
      { id:'read',    icon:'📚', name:'Leer'       },
      { id:'healthy', icon:'🥗', name:'Comer sano' },
      { id:'date',    icon:'💕', name:'Juntos'     },
      { id:'work',    icon:'💼', name:'Trabajo'    },
      { id:'meditate',icon:'🧘', name:'Meditar'    }
    ],

    SCORE: { PER_100: 1, PER_HABIT: 5, PER_SPARK: 2 },

    // Google Calendar
    GCAL_CLIENT_ID: '572897240301-uq0hhpse3ioddl9g5cpqd4cfvgf8rlm1.apps.googleusercontent.com',
    GCAL_SCOPE: 'https://www.googleapis.com/auth/calendar',

    // Claude API — pon tu Anthropic API key para habilitar temas y retos con IA
    // Consíguela en: console.anthropic.com → API Keys
    CLAUDE_API_KEY: 'YOUR_ANTHROPIC_API_KEY'
  }

  /* ═══════════════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════════════ */
  const S = {
    user: null, partner: null,
    tab: 'hoy',
    subTab: { metas:'ahorro', vida:'agenda', cuerpo:'reto', nido:'cariños', jugar:'temas' },
    // datos
    savings: [], habits: [], sparks: [], plans: [],
    goals: [],        // metas libres
    fitness: [],      // registros semanales físicos
    memories: [],     // diario del nido
    pending: [],      // pendientes juntos
    notes: [],        // notas secretas
    habitGoals: [],   // metas de hábitos semanales
    retos: [],        // retos semanales de pareja
    // google calendar
    gcalToken: null, gcalEvents: [],
    // jugar — estado temporal
    jugarTopics: [], jugarLoading: false
  }

  /* ═══════════════════════════════════════════════════
     SUPABASE
  ═══════════════════════════════════════════════════ */
  let sb = null

  function initSB() {
    if (CFG.SUPABASE_URL === 'YOUR_SUPABASE_URL') return false
    try {
      sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY)
      return true
    } catch(e) { console.error(e); return false }
  }
  const hasSB = () => !!sb

  /* ═══════════════════════════════════════════════════
     DATABASE MODULE
  ═══════════════════════════════════════════════════ */
  const DB = {
    async loadAll() {
      this._fromLocal()
      if (!hasSB()) return
      try {
        const [sv, hb, sp, pl, go, fi, me, pe, no, hg, re] = await Promise.all([
          sb.from('nido_savings'    ).select('*').order('created_at', { ascending: false }),
          sb.from('nido_habits'     ).select('*').order('created_at', { ascending: false }),
          sb.from('nido_sparks'     ).select('*').order('created_at', { ascending: false }).limit(50),
          sb.from('nido_plans'      ).select('*').order('plan_date',  { ascending: true  }),
          sb.from('nido_goals'      ).select('*').order('created_at', { ascending: false }),
          sb.from('nido_fitness'    ).select('*').order('week_start', { ascending: false }),
          sb.from('nido_memories'   ).select('*').order('happened_on',{ ascending: false }),
          sb.from('nido_pending'    ).select('*').order('created_at', { ascending: false }),
          sb.from('nido_notes'      ).select('*').order('created_at', { ascending: false }),
          sb.from('nido_habit_goals').select('*').order('created_at', { ascending: false }),
          sb.from('nido_retos'      ).select('*').order('created_at', { ascending: false })
        ])
        if (sv.data?.length) S.savings    = sv.data
        if (hb.data?.length) S.habits     = hb.data
        if (sp.data?.length) S.sparks     = sp.data
        if (pl.data?.length) S.plans      = pl.data
        if (go.data?.length) S.goals      = go.data
        if (fi.data?.length) S.fitness    = fi.data
        if (me.data?.length) S.memories   = me.data
        if (pe.data?.length) S.pending    = pe.data
        if (no.data?.length) S.notes      = no.data
        if (hg.data?.length) S.habitGoals = hg.data
        if (re.data?.length) S.retos      = re.data
        this._toLocal()
      } catch(e) { console.error('Supabase load error:', e) }
    },

    async saveSaving({ goal_id, amount, note }) {
      const row = { user_id: S.user, goal_id, amount: parseFloat(amount), note: note||'', created_at: new Date().toISOString() }
      S.savings.unshift(row)
      this._toLocal()
      if (hasSB()) {
        const { data, error } = await sb.from('nido_savings').insert(row).select()
        if (error) { console.error('Save error:', error); toast('⚠️ Error al guardar en nube — queda en local', '') }
        else if (data?.[0]) { S.savings[0] = data[0]; this._toLocal() }
      }
    },

    async saveHabit(habit_id) {
      const row = { user_id: S.user, habit_id, created_at: new Date().toISOString() }
      S.habits.unshift(row)
      this._toLocal()
      if (hasSB()) {
        const { data, error } = await sb.from('nido_habits').insert(row).select()
        if (error) { console.error('Save error:', error); toast('⚠️ Error al guardar en nube — queda en local', '') }
        else if (data?.[0]) { S.habits[0] = data[0]; this._toLocal() }
      }
    },

    async saveSpark(message) {
      const row = { from_user: S.user, to_user: S.partner, message, created_at: new Date().toISOString() }
      S.sparks.unshift(row)
      this._toLocal()
      if (hasSB()) {
        const { data, error } = await sb.from('nido_sparks').insert(row).select()
        if (!error && data?.[0]) { S.sparks[0] = data[0]; this._toLocal() }
      }
    },

    async savePlan({ title, plan_date, plan_time, note }) {
      const row = { created_by: S.user, title, plan_date, plan_time: plan_time||'19:00', note: note||'', created_at: new Date().toISOString() }
      S.plans.push(row)
      S.plans.sort((a,b) => a.plan_date.localeCompare(b.plan_date))
      this._toLocal()
      if (hasSB()) {
        const { data, error } = await sb.from('nido_plans').insert(row).select()
        if (error) { console.error('Plan save error:', error) }
        else if (data?.[0]) {
          const idx = S.plans.findIndex(p => p === row)
          if (idx !== -1) S.plans[idx] = data[0]
          this._toLocal()
        }
      }
    },

    async deletePlan(planId) {
      S.plans = S.plans.filter(p => p.id !== planId)
      this._toLocal()
      if (hasSB()) {
        await sb.from('nido_plans').delete().eq('id', planId)
      }
    },

    async saveGoal({ icon, name, type, target, unit, deadline, note }) {
      const row = { created_by: S.user, icon: icon||'🎯', name, type, target: target||null, unit: unit||'', deadline: deadline||null, note: note||'', progress: 0, done: false, created_at: new Date().toISOString() }
      S.goals.unshift(row); this._toLocal()
      if (hasSB()) {
        const { data } = await sb.from('nido_goals').insert(row).select()
        if (data?.[0]) { S.goals[0] = data[0]; this._toLocal() }
      }
    },

    async updateGoalProgress(goalId, progress) {
      const idx = S.goals.findIndex(g => g.id === goalId)
      if (idx === -1) return
      const g = S.goals[idx]
      const done = g.type === 'numeric' ? progress >= (g.target||1) : progress >= 1
      S.goals[idx] = { ...g, progress, done }; this._toLocal()
      if (hasSB()) await sb.from('nido_goals').update({ progress, done }).eq('id', goalId)
    },

    async saveFitness(row) {
      // row: { user_id, week_start, weight, waist, arm, gym_days, cardio_min, water_avg, sleep_avg, energy, highlight }
      const existing = S.fitness.find(f => f.user_id === row.user_id && f.week_start === row.week_start)
      if (existing) {
        const updated = { ...existing, ...row }
        S.fitness = S.fitness.map(f => (f.user_id === row.user_id && f.week_start === row.week_start) ? updated : f)
        this._toLocal()
        if (hasSB()) await sb.from('nido_fitness').update(row).eq('id', existing.id)
      } else {
        const newRow = { ...row, created_at: new Date().toISOString() }
        S.fitness.unshift(newRow); this._toLocal()
        if (hasSB()) {
          const { data } = await sb.from('nido_fitness').insert(newRow).select()
          if (data?.[0]) { S.fitness[0] = data[0]; this._toLocal() }
        }
      }
    },

    async saveMemory({ title, text, photo, happened_on }) {
      const row = { created_by: S.user, title, text: text||'', photo: photo||null, happened_on: happened_on || new Date().toISOString().slice(0,10), created_at: new Date().toISOString() }
      S.memories.unshift(row); this._toLocal()
      if (hasSB()) {
        const { data } = await sb.from('nido_memories').insert(row).select()
        if (data?.[0]) { S.memories[0] = data[0]; this._toLocal() }
      }
    },

    async savePending({ icon, name, type, note }) {
      const row = { created_by: S.user, icon: icon||'📌', name, type, note: note||'', status: 'want', votes: {}, created_at: new Date().toISOString() }
      S.pending.unshift(row); this._toLocal()
      if (hasSB()) {
        const { data } = await sb.from('nido_pending').insert(row).select()
        if (data?.[0]) { S.pending[0] = data[0]; this._toLocal() }
      }
    },

    async updatePendingStatus(id, status) {
      S.pending = S.pending.map(p => p.id === id ? { ...p, status } : p); this._toLocal()
      if (hasSB()) await sb.from('nido_pending').update({ status }).eq('id', id)
    },

    async saveNote(message) {
      const row = { from_user: S.user, to_user: S.partner, message, read: false, created_at: new Date().toISOString() }
      S.notes.unshift(row); this._toLocal()
      if (hasSB()) {
        const { data } = await sb.from('nido_notes').insert(row).select()
        if (data?.[0]) { S.notes[0] = data[0]; this._toLocal() }
      }
    },

    async saveReto(reto) {
      S.retos.unshift(reto); this._toLocal()
      if (hasSB()) {
        const { data } = await sb.from('nido_retos').insert(reto).select()
        if (data?.[0]) { S.retos[0] = data[0]; this._toLocal() }
      }
    },

    async saveHabitGoal({ habit_id, target_days }) {
      // target_days: cuántos días por semana quieren lograr este hábito
      const existing = S.habitGoals.find(h => h.habit_id === habit_id)
      if (existing) {
        S.habitGoals = S.habitGoals.map(h => h.habit_id === habit_id ? { ...h, target_days } : h); this._toLocal()
        if (hasSB()) await sb.from('nido_habit_goals').update({ target_days }).eq('id', existing.id)
      } else {
        const row = { habit_id, target_days, created_at: new Date().toISOString() }
        S.habitGoals.push(row); this._toLocal()
        if (hasSB()) {
          const { data } = await sb.from('nido_habit_goals').insert(row).select()
          if (data?.[0]) { S.habitGoals[S.habitGoals.length-1] = data[0]; this._toLocal() }
        }
      }
    },

    _toLocal() {
      const keys = ['savings','habits','sparks','plans','goals','fitness','memories','pending','notes','habitGoals','retos']
      keys.forEach(k => localStorage.setItem(`nido_${k}`, JSON.stringify(S[k])))
    },

    _fromLocal() {
      const load = (key) => JSON.parse(localStorage.getItem(`nido_${key}`) || '[]')
      S.savings    = load('savings')
      S.habits     = load('habits')
      S.sparks     = load('sparks')
      S.plans      = load('plans')
      S.goals      = load('goals')
      S.fitness    = load('fitness')
      S.memories   = load('memories')
      S.pending    = load('pending')
      S.notes      = load('notes')
      S.habitGoals = load('habitGoals')
      S.retos      = load('retos')
    }
  }

  /* ═══════════════════════════════════════════════════
     REALTIME MODULE
  ═══════════════════════════════════════════════════ */
  const RT = {
    chs: [],
    sub() {
      if (!hasSB()) return

      const onSaving = (payload) => {
        const r = payload.new
        if (S.savings.find(s => s.id === r.id)) return
        S.savings.unshift(r); DB._toLocal()
        if (r.user_id === S.partner) {
          const g = CFG.GOALS[r.goal_id]
          toast(`${CFG.USERS[S.partner].name} ahorró $${fmt(r.amount)} para ${g?.icon} ${g?.name}! 🪺`, 'hot')
        }
        renderCurrent()
      }

      const onHabit = (payload) => {
        const r = payload.new
        if (S.habits.find(h => h.id === r.id)) return
        S.habits.unshift(r); DB._toLocal()
        if (r.user_id === S.partner) {
          const h = CFG.HABITS.find(x => x.id === r.habit_id)
          toast(`${CFG.USERS[S.partner].name} completó: ${h?.icon} ${h?.name} ⚡`, 'hot')
        }
        renderCurrent()
      }

      const onSpark = (payload) => {
        const r = payload.new
        if (S.sparks.find(s => s.id === r.id)) return
        S.sparks.unshift(r); DB._toLocal()
        if (r.to_user === S.user) {
          toast(`💕 ${CFG.USERS[S.partner].name}: "${r.message}"`, 'hot')
        }
        renderCurrent()
      }

      const onGeneric = (table, key, arr) => (payload) => {
        const r = payload.new
        if (S[arr].find(x => x.id === r.id)) return
        S[arr].unshift(r); DB._toLocal()
        renderCurrent()
      }

      this.chs = [
        sb.channel('nido-savings').on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_savings'     }, onSaving ).subscribe(),
        sb.channel('nido-habits' ).on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_habits'      }, onHabit  ).subscribe(),
        sb.channel('nido-sparks' ).on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_sparks'      }, onSpark  ).subscribe(),
        sb.channel('nido-plans'  ).on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_plans'       }, (payload) => {
          const r = payload.new
          if (S.plans.find(p => p.id === r.id)) return
          S.plans.push(r); S.plans.sort((a,b) => a.plan_date.localeCompare(b.plan_date))
          DB._toLocal()
          if (r.created_by === S.partner) toast(`📅 ${CFG.USERS[S.partner].name} agregó un plan: "${r.title}"`, 'hot')
          renderCurrent()
        }).subscribe(),
        sb.channel('nido-goals'   ).on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_goals'      }, onGeneric('nido_goals',    'id', 'goals'   )).subscribe(),
        sb.channel('nido-fitness' ).on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_fitness'    }, onGeneric('nido_fitness',  'id', 'fitness'  )).subscribe(),
        sb.channel('nido-memories').on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_memories'   }, (payload) => {
          const r = payload.new
          if (S.memories.find(x => x.id === r.id)) return
          S.memories.unshift(r); DB._toLocal()
          if (r.user_id === S.partner) toast(`📸 ${CFG.USERS[S.partner].name} agregó un recuerdo: "${r.title}"`, 'hot')
          renderCurrent()
        }).subscribe(),
        sb.channel('nido-pending' ).on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_pending'    }, onGeneric('nido_pending',  'id', 'pending'  )).subscribe(),
        sb.channel('nido-notes'   ).on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_notes'      }, (payload) => {
          const r = payload.new
          if (S.notes.find(x => x.id === r.id)) return
          S.notes.unshift(r); DB._toLocal()
          if (r.to_user === S.user) toast(`💌 ¡Tienes una nota secreta de ${CFG.USERS[S.partner].name}!`, 'hot')
          renderCurrent()
        }).subscribe(),
        sb.channel('nido-retos').on('postgres_changes', { event:'INSERT', schema:'public', table:'nido_retos' }, onGeneric('nido_retos', 'id', 'retos')).subscribe(),
      ]
    }
  }

  /* ═══════════════════════════════════════════════════
     GOOGLE CALENDAR
  ═══════════════════════════════════════════════════ */
  const GCAL = {
    _key: 'nido_gcal_token',

    saveToken(t) {
      const exp = Date.now() + (t.expires_in || 3600) * 1000
      localStorage.setItem(this._key, JSON.stringify({ token: t.access_token, exp }))
      S.gcalToken = t.access_token
    },

    loadToken() {
      try {
        const raw = localStorage.getItem(this._key)
        if (!raw) return null
        const { token, exp } = JSON.parse(raw)
        if (Date.now() > exp) { localStorage.removeItem(this._key); S.gcalToken = null; return null }
        S.gcalToken = token
        return token
      } catch(e) { return null }
    },

    isConnected() { return !!S.gcalToken },

    connect(silent = false) {
      if (!window.google?.accounts?.oauth2) {
        if (!silent) toast('Google aún cargando, intenta en 2 seg')
        return
      }
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: CFG.GCAL_CLIENT_ID,
        scope: CFG.GCAL_SCOPE,
        prompt: silent ? '' : 'select_account',
        callback: (resp) => {
          if (resp.error) {
            if (!silent) toast('Error al conectar Google Calendar')
            return
          }
          this.saveToken(resp)
          if (!silent) toast('📅 Google Calendar conectado ✓', 'ok')
          this.fetchEvents().then(() => renderCurrent())
        }
      })
      client.requestAccessToken()
    },

    // Renueva el token silenciosamente si está por expirar
    silentRefresh() {
      const raw = localStorage.getItem(this._key)
      if (!raw) return  // nunca conectó, no hacer nada
      try {
        const { exp } = JSON.parse(raw)
        // Si expira en menos de 10 min, renovar en silencio
        if (exp - Date.now() < 10 * 60 * 1000) {
          this.connect(true)
        }
      } catch(e) {}
    },

    disconnect() {
      localStorage.removeItem(this._key)
      S.gcalToken = null
      S.gcalEvents = []
      renderCurrent()
    },

    async fetchEvents() {
      if (!S.gcalToken) return
      const now   = new Date()
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString()
      const end   = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 14, 23, 59).toISOString()
      try {
        const res = await fetch(
          `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${start}&timeMax=${end}&singleEvents=true&orderBy=startTime&maxResults=20`,
          { headers: { Authorization: `Bearer ${S.gcalToken}` } }
        )
        if (!res.ok) { if (res.status === 401) this.disconnect(); return }
        const data = await res.json()
        S.gcalEvents = data.items || []
        localStorage.setItem('nido_gcal_events', JSON.stringify(S.gcalEvents))
      } catch(e) { console.error('GCal fetch error:', e) }
    },

    async createEvent({ title, date, time, note }) {
      if (!S.gcalToken) return false
      const startDT = `${date}T${time || '19:00'}:00`
      const [h, m]  = (time || '19:00').split(':').map(Number)
      const endH    = String(h + 1).padStart(2,'0')
      const endDT   = `${date}T${endH}:${String(m).padStart(2,'0')}:00`
      try {
        const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
          method: 'POST',
          headers: { Authorization: `Bearer ${S.gcalToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            summary: `🪺 ${title}`,
            description: note || 'Plan de Nido',
            start: { dateTime: startDT, timeZone: 'America/Mexico_City' },
            end:   { dateTime: endDT,   timeZone: 'America/Mexico_City' },
            reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 60 }] }
          })
        })
        return res.ok
      } catch(e) { return false }
    },

    fmtTime(iso) {
      if (!iso) return ''
      const d = new Date(iso)
      return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })
    },

    fmtEventDate(iso) {
      const d = new Date(iso)
      return d.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short' })
    }
  }

  /* ═══════════════════════════════════════════════════
     CALCULATIONS
  ═══════════════════════════════════════════════════ */
  function weekBounds() {
    const now = new Date(), d = now.getDay()
    const mon = new Date(now)
    mon.setDate(now.getDate() - (d === 0 ? 6 : d - 1))
    mon.setHours(0,0,0,0)
    const sun = new Date(mon)
    sun.setDate(mon.getDate() + 6)
    sun.setHours(23,59,59,999)
    return { mon, sun }
  }

  function weekScore(userId) {
    const { mon, sun } = weekBounds()
    const inWeek = (iso) => { const d = new Date(iso); return d >= mon && d <= sun }

    const sv = S.savings.filter(s => s.user_id === userId && inWeek(s.created_at))
    const hb = S.habits .filter(h => h.user_id === userId && inWeek(h.created_at))
    const sp = S.sparks .filter(s => s.from_user === userId && inWeek(s.created_at))

    const savTotal  = sv.reduce((a,s) => a + (s.amount||0), 0)
    const savPts    = Math.floor(savTotal / 100) * CFG.SCORE.PER_100
    const habPts    = hb.length * CFG.SCORE.PER_HABIT
    const sparkPts  = sp.length * CFG.SCORE.PER_SPARK

    return { total: savPts+habPts+sparkPts, savTotal, savPts, habPts, sparkPts, habCount: hb.length, sparkCount: sp.length }
  }

  function goalTotal(goalId, userId=null) {
    return S.savings
      .filter(s => s.goal_id === goalId && (userId === null || s.user_id === userId))
      .reduce((a,s) => a+(s.amount||0), 0)
  }

  function todayFeed() {
    const start = new Date(); start.setHours(0,0,0,0)
    const all = [
      ...S.savings.filter(s => new Date(s.created_at) >= start).map(s => ({
        type:'saving', uid: s.user_id,
        text: `ahorró $${fmt(s.amount)} para ${CFG.GOALS[s.goal_id]?.name || s.goal_id}`,
        icon: CFG.GOALS[s.goal_id]?.icon || '💰', ts: s.created_at
      })),
      ...S.habits.filter(h => new Date(h.created_at) >= start).map(h => {
        const hb = CFG.HABITS.find(x => x.id === h.habit_id)
        return { type:'habit', uid: h.user_id, text:`completó ${hb?.name||h.habit_id}`, icon: hb?.icon||'✅', ts: h.created_at }
      }),
      ...S.sparks.filter(s => new Date(s.created_at) >= start).map(s => ({
        type:'spark', uid: s.from_user,
        text: `mandó una 💕: "${s.message}"`, icon:'💕', ts: s.created_at
      }))
    ]
    return all.sort((a,b) => new Date(b.ts) - new Date(a.ts))
  }

  /* ═══════════════════════════════════════════════════
     HELPERS
  ═══════════════════════════════════════════════════ */
  function fmt(n) { return new Intl.NumberFormat('es-MX').format(Math.round(n||0)) }

  function ago(iso) {
    const m = Math.floor((Date.now() - new Date(iso)) / 60000)
    if (m < 1) return 'justo ahora'
    if (m < 60) return `hace ${m} min`
    const h = Math.floor(m/60)
    if (h < 24) return `hace ${h}h`
    return `hace ${Math.floor(h/24)}d`
  }

  function greeting() {
    const h = new Date().getHours()
    return h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches'
  }

  function fmtDate(d) {
    return new Intl.DateTimeFormat('es-MX', { weekday:'long', day:'numeric', month:'long' }).format(d)
  }

  let _tt = null
  function toast(msg, type='') {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = type ? `show ${type}` : 'show'
    clearTimeout(_tt)
    _tt = setTimeout(() => { el.className = '' }, 3600)
  }

  /* ═══════════════════════════════════════════════════
     RENDER — RETOS
  ═══════════════════════════════════════════════════ */
  function renderRetos() {
    const { mon, sun } = weekBounds()
    const me   = CFG.USERS[S.user]
    const them = CFG.USERS[S.partner]
    const myW  = weekScore(S.user)
    const thW  = weekScore(S.partner)

    const myLead = myW.total > thW.total
    const tied   = myW.total === thW.total
    const banner = tied
      ? '¡Van empatados! Cualquiera puede ganar 🔥'
      : `${(myLead ? me : them).name} va ganando esta semana 👑`

    const weekLabel = `${mon.getDate()}/${mon.getMonth()+1} — ${sun.getDate()}/${sun.getMonth()+1}`

    const breakdown = (score, ucfg) => `
      <div class="score-row"><div class="score-icon">💰</div><div class="score-lbl">Ahorro ($${fmt(score.savTotal)})</div><div class="score-pts">+${score.savPts}</div></div>
      <div class="score-row"><div class="score-icon">✅</div><div class="score-lbl">Hábitos (${score.habCount})</div><div class="score-pts">+${score.habPts}</div></div>
      <div class="score-row"><div class="score-icon">💕</div><div class="score-lbl">Cariños enviados (${score.sparkCount})</div><div class="score-pts">+${score.sparkPts}</div></div>`

    document.getElementById('tab-content').innerHTML = `
      <div class="page">
        <div class="page-header">
          <div class="page-title">Retos ⚡</div>
          <div style="font-size:12px;color:var(--text-muted)">${weekLabel}</div>
        </div>

        <!-- VS -->
        <div class="grad-card">
          <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;text-align:center">Semana en curso</div>
          <div class="vs-row">
            <div class="vs-player">
              <div class="vs-player-em">${me.emoji}</div>
              <div class="vs-player-name">${me.name} ${myLead&&!tied?'👑':''}</div>
              <div class="vs-player-score">${myW.total}</div>
            </div>
            <div class="vs-sep">VS</div>
            <div class="vs-player">
              <div class="vs-player-em">${them.emoji}</div>
              <div class="vs-player-name">${them.name} ${!myLead&&!tied?'👑':''}</div>
              <div class="vs-player-score">${thW.total}</div>
            </div>
          </div>
          <div class="vs-banner">${banner}</div>
        </div>

        <!-- Premio -->
        <div class="card" style="border:2px solid var(--rose-pale)">
          <div class="card-label">🏆 Premio en juego</div>
          <div style="font-size:16px;font-weight:700;margin-bottom:4px">El ganador elige...</div>
          <div style="font-size:14px;color:var(--text-muted)">El plan del fin de semana o en qué gastar su siguiente presupuesto juntos</div>
        </div>

        <!-- Cómo se gana -->
        <div class="card">
          <div class="card-label">¿Cómo se ganan puntos?</div>
          <div class="score-row"><div class="score-icon">💰</div><div class="score-lbl">Cada $100 ahorrados</div><div class="score-pts">+1 pt</div></div>
          <div class="score-row"><div class="score-icon">✅</div><div class="score-lbl">Cada hábito completado</div><div class="score-pts">+5 pts</div></div>
          <div class="score-row"><div class="score-icon">💕</div><div class="score-lbl">Cada cariño enviado</div><div class="score-pts">+2 pts</div></div>
        </div>

        <!-- Mis pts -->
        <div class="card">
          <div class="card-label">Desglose — ${me.name}</div>
          ${breakdown(myW, me)}
        </div>

        <!-- Sus pts -->
        <div class="card">
          <div class="card-label">Desglose — ${them.name}</div>
