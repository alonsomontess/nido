      </div>`
  }

  /* ═══════════════════════════════════════════════════
     RENDER — PLANES + CALENDARIO
  ═══════════════════════════════════════════════════ */
  function renderPlanes() {
    const today     = new Date().toISOString().slice(0,10)
    const upcoming  = S.plans.filter(p => p.plan_date >= today)
    const past      = S.plans.filter(p => p.plan_date < today).reverse().slice(0,5)
    const gcalConn  = GCAL.isConnected()
    const me        = CFG.USERS[S.user]
    const them      = CFG.USERS[S.partner]

    function planCard(p) {
      const creator = CFG.USERS[p.created_by]
      const isPast  = p.plan_date < today
      return `
        <div style="background:var(--warm-white);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;border-left:4px solid ${isPast ? 'var(--border)' : 'var(--rose)'}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
            <div style="flex:1">
              <div style="font-size:15px;font-weight:700;color:${isPast ? 'var(--text-muted)' : 'var(--text)'}">${p.title}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:3px">
                📅 ${fmtPlanDate(p.plan_date)} · ⏰ ${p.plan_time || '19:00'} · ${creator?.emoji} ${creator?.name}
              </div>
              ${p.note ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px">${p.note}</div>` : ''}
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
              ${!isPast && gcalConn ? `<button onclick="addPlanToCalendar('${p.id}')" style="background:var(--rose-ghost);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--rose);cursor:pointer;white-space:nowrap">+ Cal</button>` : ''}
              ${p.id ? `<button onclick="deletePlan('${p.id}')" style="background:none;border:none;font-size:18px;cursor:pointer;opacity:.4;padding:0">🗑</button>` : ''}
            </div>
          </div>
        </div>`
    }

    // Google Calendar events (next 14 days)
    const eventsHtml = !gcalConn
      ? `<div style="text-align:center;padding:16px 0">
           <button class="btn-primary" onclick="GCAL.connect()">📅 Conectar Google Calendar</button>
           <p style="font-size:12px;color:var(--text-muted);margin-top:10px">Conecta tu calendario para ver tus eventos y agregar planes automáticamente</p>
         </div>`
      : S.gcalEvents.length === 0
        ? `<div class="empty"><p>No hay eventos en los próximos 14 días</p></div>`
        : S.gcalEvents.map(ev => {
            const start = ev.start?.dateTime || ev.start?.date
            const isAllDay = !ev.start?.dateTime
            return `
              <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
                <div style="width:38px;height:38px;background:var(--rose-pale);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">📅</div>
                <div style="flex:1">
                  <div style="font-size:13px;font-weight:600">${ev.summary || 'Sin título'}</div>
                  <div style="font-size:12px;color:var(--text-muted)">${isAllDay ? fmtPlanDate(ev.start.date) : GCAL.fmtEventDate(start) + ' · ' + GCAL.fmtTime(start)}</div>
                </div>
              </div>`
          }).join('')

    document.getElementById('tab-content').innerHTML = `
      <div class="page">
        <div class="page-header">
          <div class="page-title">Planes 📅</div>
          <button class="btn-ghost" onclick="openAddPlan()">+ Agregar</button>
        </div>

        <!-- Próximos planes -->
        <div style="margin-bottom:14px">
          <div class="card-label" style="margin-bottom:10px">PRÓXIMOS PLANES</div>
          ${upcoming.length === 0
            ? `<div class="empty"><div class="ei">🗓</div><p>No hay planes todavía.<br>¡Planeen algo juntos!</p></div>`
            : upcoming.map(planCard).join('')}
          <button class="btn-primary" onclick="openAddPlan()">📅 + Nuevo plan</button>
        </div>

        <!-- Retos mini (score semanal) -->
        <div class="card" style="background:linear-gradient(135deg,rgba(55,30,80,.9),rgba(194,24,91,.8));color:#fff">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:10px">Reto semanal ⚡</div>
          <div style="display:flex;align-items:center;justify-content:space-around">
            <div style="text-align:center">
              <div style="font-size:28px;font-weight:700">${weekScore(S.user).total}</div>
              <div style="font-size:12px;opacity:.8">${me.emoji} ${me.name}</div>
            </div>
            <div style="font-size:14px;opacity:.5">VS</div>
            <div style="text-align:center">
              <div style="font-size:28px;font-weight:700">${weekScore(S.partner).total}</div>
              <div style="font-size:12px;opacity:.8">${them.emoji} ${them.name}</div>
            </div>
          </div>
        </div>

        <!-- Google Calendar -->
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div class="card-label" style="margin-bottom:0">MI GOOGLE CALENDAR</div>
            ${gcalConn ? `
              <div style="display:flex;gap:8px">
                <button onclick="GCAL.fetchEvents().then(renderCurrent)" style="background:var(--rose-ghost);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--rose);cursor:pointer">↻</button>
                <button onclick="GCAL.disconnect()" style="background:none;border:none;font-size:12px;color:var(--text-muted);cursor:pointer">Desconectar</button>
              </div>` : ''}
          </div>
          ${eventsHtml}
        </div>

        <!-- Planes pasados -->
        ${past.length > 0 ? `
          <div class="card">
            <div class="card-label">PLANES PASADOS</div>
            ${past.map(planCard).join('')}
          </div>` : ''}
      </div>`
  }

  function fmtPlanDate(dateStr) {
    const [y,m,d] = dateStr.split('-').map(Number)
    return new Date(y,m-1,d).toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'long' })
  }

  async function addPlanToCalendar(planId) {
    const plan = S.plans.find(p => p.id === planId)
    if (!plan) return
    const ok = await GCAL.createEvent({ title: plan.title, date: plan.plan_date, time: plan.plan_time, note: plan.note })
    toast(ok ? '📅 Agregado a tu Google Calendar ✓' : 'Error al agregar al calendario', ok ? 'ok' : '')
  }

  async function deletePlan(planId) {
    if (!confirm('¿Eliminar este plan?')) return
    await DB.deletePlan(planId)
    renderCurrent()
    toast('Plan eliminado', '')
  }

  function openAddPlan() {
    document.getElementById('sheet-body').innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">📅 Nuevo plan</div>
      <div class="form-group">
        <label class="form-label">¿Qué van a hacer?</label>
        <input type="text" class="form-input" id="pl-title" placeholder="ej. Cena en Sonora Grill, Película en casa..." />
      </div>
      <div class="form-group">
        <label class="form-label">Fecha</label>
        <input type="date" class="form-input" id="pl-date" value="${new Date().toISOString().slice(0,10)}" />
      </div>
      <div class="form-group">
        <label class="form-label">Hora</label>
        <input type="time" class="form-input" id="pl-time" value="19:00" />
      </div>
      <div class="form-group">
        <label class="form-label">Nota (opcional)</label>
        <input type="text" class="form-input" id="pl-note" placeholder="ej. Reservación a nombre de Alonso" />
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <input type="checkbox" id="pl-gcal" ${GCAL.isConnected() ? 'checked' : 'disabled'} style="width:18px;height:18px;accent-color:var(--rose)" />
        <label for="pl-gcal" style="font-size:13px;color:${GCAL.isConnected() ? 'var(--text)' : 'var(--text-muted)'};font-weight:600">
          ${GCAL.isConnected() ? 'Agregar a mi Google Calendar' : 'Conecta Google Calendar para sincronizar'}
        </label>
      </div>
      <button class="btn-primary" onclick="submitPlan()">📅 Guardar plan</button>`
    document.getElementById('sheet-wrap').classList.add('open')
  }

  async function submitPlan() {
    const title    = document.getElementById('pl-title')?.value?.trim()
    const plan_date = document.getElementById('pl-date')?.value
    const plan_time = document.getElementById('pl-time')?.value
    const note     = document.getElementById('pl-note')?.value?.trim()
    const addCal   = document.getElementById('pl-gcal')?.checked

    if (!title)     { toast('Ponle nombre al plan'); return }
    if (!plan_date) { toast('Selecciona una fecha'); return }

    await DB.savePlan({ title, plan_date, plan_time, note })

    if (addCal && GCAL.isConnected()) {
      const ok = await GCAL.createEvent({ title, date: plan_date, time: plan_time, note })
      if (ok) toast('📅 Plan guardado y en tu Google Calendar ✓', 'ok')
      else    toast('Plan guardado (error al agregar al calendario)', '')
    } else {
      toast('📅 Plan guardado ✓', 'ok')
    }

    closeSheet()
    renderCurrent()
  }

  /* ═══════════════════════════════════════════════════
     RENDER — VIDA (agenda · pendientes · diario)
  ═══════════════════════════════════════════════════ */
  function renderVida() {
    const sub  = S.subTab.vida
    const tabs = subTabsHtml('vida', [
      { id:'agenda',    label:'🗓 Agenda'    },
      { id:'pendientes',label:'🎬 Pendientes'},
      { id:'diario',    label:'📖 Diario'   }
    ])

    if (sub === 'agenda') {
      // ── Agenda: vista mensual + planes del mes ──
      const now    = new Date()
      const year   = now.getFullYear(), month = now.getMonth()
      const first  = new Date(year, month, 1).getDay() // 0=dom
      const days   = new Date(year, month+1, 0).getDate()
      const today  = now.toISOString().slice(0,10)
      const planDates = new Set(S.plans.map(p => p.plan_date))

      const DOW = ['D','L','M','X','J','V','S']
      let cal = DOW.map(d => `<div class="cal-hdr">${d}</div>`).join('')
      // blancos iniciales (semana empieza el lunes)
      const startDay = first === 0 ? 6 : first - 1
      for (let i=0; i<startDay; i++) cal += `<div class="cal-day other-month"></div>`
      for (let d=1; d<=days; d++) {
        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
        const isToday = ds === today
        const hasEv   = planDates.has(ds) || S.gcalEvents.some(e => (e.start?.date||e.start?.dateTime||'').startsWith(ds))
        cal += `<div class="cal-day ${isToday?'today':''} ${hasEv?'has-event':''}" onclick="filterAgendaDay('${ds}')">${d}</div>`
      }

      const upcoming = S.plans.filter(p => p.plan_date >= today).slice(0,8)
      const planCards = upcoming.length === 0
        ? `<div class="empty"><div class="ei">🗓</div><p>No hay planes próximos</p></div>`
        : upcoming.map(p => {
            const c = CFG.USERS[p.created_by]
            return `<div class="card" style="margin-bottom:10px;border-left:3px solid var(--rose)">
              <div style="font-size:14px;font-weight:700">${p.title}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:3px">📅 ${fmtPlanDate(p.plan_date)} · ⏰ ${p.plan_time||'19:00'} · ${c?.emoji} ${c?.name}</div>
              ${p.note ? `<div style="font-size:12px;color:var(--text-muted);margin-top:3px">${p.note}</div>` : ''}
            </div>`
          }).join('')

      document.getElementById('tab-content').innerHTML = `
        <div class="page">
          <div class="page-header"><div class="page-title">Vida juntos 🌸</div><button class="btn-ghost" onclick="openAddPlan()">+ Plan</button></div>
          ${tabs}
          <div class="card">
            <div style="font-size:14px;font-weight:700;text-align:center;margin-bottom:12px">${now.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</div>
            <div class="cal-grid">${cal}</div>
          </div>
          <div class="card-label" style="margin-top:4px">PRÓXIMOS PLANES</div>
          ${planCards}
        </div>`
      return
    }

    if (sub === 'pendientes') {
      // ── Pendientes juntos ──
      const cats = [
        { id:'all',        label:'Todo' },
        { id:'pelicula',   label:'🎬 Películas' },
        { id:'serie',      label:'📺 Series' },
        { id:'restaurante',label:'🍽️ Restaurantes' },
        { id:'lugar',      label:'📍 Lugares' },
        { id:'actividad',  label:'🎭 Planes' },
        { id:'libro',      label:'📚 Libros' },
      ]
      const filterSub = S._pendFilter || 'all'
      const filtered = filterSub === 'all' ? S.pending : S.pending.filter(p => p.type === filterSub)
      const statusLabel = { want:'Quiero', booked:'Reservado', done:'Fuimos/Vimos' }
      const statusCls   = { want:'status-want', booked:'status-booked', done:'status-done' }
      const listHtml = filtered.length === 0
        ? `<div class="empty"><div class="ei">📌</div><p>Nada por aquí todavía</p></div>`
        : filtered.map(p => `
            <div class="pending-card" onclick="cyclePendingStatus('${p.id}')">
              <div class="pending-icon">${p.type_icon || p.icon || '🎬'}</div>
              <div style="flex:1">
                <div class="pending-name">${p.name}</div>
                ${p.note ? `<div class="pending-meta">${p.note}</div>` : ''}
              </div>
              <div class="pending-status ${statusCls[p.status]||'status-want'}">${statusLabel[p.status]||'Quiero'}</div>
            </div>`).join('')

      document.getElementById('tab-content').innerHTML = `
        <div class="page">
          <div class="page-header"><div class="page-title">Pendientes 🎬</div></div>
          ${tabs}
          <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch">
            ${cats.map(c => `<div class="sub-tab ${filterSub===c.id?'active':''}" onclick="S._pendFilter='${c.id}';renderCurrent()">${c.label}</div>`).join('')}
          </div>
          ${listHtml}
          <button class="btn-primary" onclick="openAddPending()">📌 + Agregar</button>
        </div>`
      return
    }

    if (sub === 'diario') {
      // ── Diario del nido ──
      const memsHtml = S.memories.length === 0
        ? `<div class="empty"><div class="ei">📸</div><p>El diario está vacío.<br>¡Agrega su primer recuerdo!</p></div>`
        : S.memories.map(m => {
            const c = CFG.USERS[m.created_by]
            return `<div class="memory-card">
              ${m.photo ? `<img class="memory-img" src="${m.photo}" alt="recuerdo">` : `<div style="height:8px;background:linear-gradient(135deg,var(--rose-pale),var(--rose-ghost))"></div>`}
              <div class="memory-body">
                <div class="memory-title">${m.title}</div>
                ${m.text ? `<div class="memory-text">${m.text}</div>` : ''}
                <div class="memory-footer">
                  <span>${c?.emoji} ${c?.name}</span>
                  <span>·</span>
                  <span>${fmtPlanDate(m.happened_on)}</span>
                </div>
              </div>
            </div>`
          }).join('')

      document.getElementById('tab-content').innerHTML = `
        <div class="page">
          <div class="page-header"><div class="page-title">Diario 📸</div></div>
          ${tabs}
          ${memsHtml}
          <button class="btn-primary" onclick="openAddMemory()">📸 + Agregar recuerdo</button>
        </div>`
      return
    }

  }

  /* ═══════════════════════════════════════════════════
     RENDER — CUERPO (reto físico · hábitos mejorados)
  ═══════════════════════════════════════════════════ */
  function renderCuerpo() {
    const sub  = S.subTab.cuerpo
    const tabs = subTabsHtml('cuerpo', [
      { id:'reto',    label:'💪 Reto físico' },
      { id:'habitos', label:'✅ Hábitos'      }
    ])

    if (sub === 'habitos') {
      const { mon } = weekBounds()
      const daysOfWeek = ['L','M','X','J','V','S','D']
      const habGoalsHtml = CFG.HABITS.map(h => {
        const goal = S.habitGoals.find(g => g.habit_id === h.id)
        const target = goal?.target_days || 0
        // contar este hábito esta semana por usuario
        const myCount   = S.habits.filter(x => x.user_id === S.user   && x.habit_id === h.id && new Date(x.created_at) >= mon).length
        const themCount = S.habits.filter(x => x.user_id === S.partner && x.habit_id === h.id && new Date(x.created_at) >= mon).length
        const myPct  = target > 0 ? Math.min(Math.round(myCount/target*100),100) : 0
        const me     = CFG.USERS[S.user]
        const them   = CFG.USERS[S.partner]
        return `<div class="habit-goal-card">
          <div class="habit-goal-header">
            <div class="habit-goal-icon">${h.icon}</div>
            <div style="flex:1">
              <div class="habit-goal-name">${h.name}</div>
              ${target > 0 ? `<div style="font-size:11px;color:var(--text-muted)">Meta: ${target}x/semana</div>` : `<div style="font-size:11px;color:var(--text-muted)">Sin meta — <button onclick="openSetHabitGoal('${h.id}')" style="background:none;border:none;color:var(--rose);font-weight:600;cursor:pointer;font-size:11px">Configurar</button></div>`}
            </div>
            ${target > 0 ? `<div class="habit-goal-pct">${myPct}%</div>` : ''}
          </div>
          ${target > 0 ? `<div class="progress-wrap" style="margin-bottom:8px"><div class="progress-fill" style="width:${myPct}%"></div></div>` : ''}
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-size:12px;color:var(--text-muted)">${me.emoji} ${myCount} · ${them.emoji} ${themCount}</div>
            <button onclick="openLog('habito')" style="background:var(--rose-ghost);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--rose);cursor:pointer">+ Registrar</button>
          </div>
        </div>`
      }).join('')

      document.getElementById('tab-content').innerHTML = `
        <div class="page">
          <div class="page-header"><div class="page-title">Hábitos ✅</div></div>
          ${tabs}
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Toca "Configurar" para establecer tu meta semanal de cada hábito</div>
          ${habGoalsHtml}
        </div>`
      return
    }

    // ── Reto físico ──
    const me   = CFG.USERS[S.user]
    const them = CFG.USERS[S.partner]
    const ws   = weekStart()

    const myLog   = S.fitness.find(f => f.user_id === S.user   && f.week_start === ws)
    const themLog = S.fitness.find(f => f.user_id === S.partner && f.week_start === ws)

    // Calcular puntos físicos de esta semana
    const fitnessScore = (log, prevLog) => {
      if (!log) return 0
      let pts = 0
      pts += (log.gym_days||0) * 10
      if (log.cardio_min >= 150) pts += 15
      const waterDays = Math.min(log.water_avg||0, 7)
      pts += waterDays >= 8 ? 21 : Math.floor((waterDays/8)*21)
      if ((log.sleep_avg||0) >= 7) pts += 14
      if (prevLog) {
        const wDiff = (prevLog.weight||0) - (log.weight||0)
        if (wDiff > 0) pts += Math.floor(wDiff * 8)
        const cDiff = (prevLog.waist||0) - (log.waist||0)
        if (cDiff > 0) pts += Math.floor(cDiff * 25)
        const aDiff = (log.arm||0) - (prevLog.arm||0)
        if (aDiff > 0) pts += Math.floor(aDiff * 20)
      }
      return pts
    }

    const allWeeks  = [...new Set(S.fitness.map(f => f.week_start))].sort().reverse()
    const prevWs    = allWeeks.find(w => w < ws)
    const myPrev    = prevWs ? S.fitness.find(f => f.user_id === S.user   && f.week_start === prevWs) : null
    const themPrev  = prevWs ? S.fitness.find(f => f.user_id === S.partner && f.week_start === prevWs) : null

    const myFPts    = fitnessScore(myLog, myPrev)
    const themFPts  = fitnessScore(themLog, themPrev)
    const myLeads   = myFPts >= themFPts

    const metrics = [
      { icon:'⚖️', lbl:'Peso (kg)',      key:'weight',    unit:'kg' },
      { icon:'📏', lbl:'Cintura (cm)',    key:'waist',     unit:'cm' },
      { icon:'💪', lbl:'Brazo (cm)',      key:'arm',       unit:'cm', higher:true },
      { icon:'🏋️', lbl:'Días de gym',    key:'gym_days',  unit:'días', higher:true },
      { icon:'🏃', lbl:'Cardio (min)',    key:'cardio_min',unit:'min', higher:true },
      { icon:'💧', lbl:'Agua (vasos/día)',key:'water_avg', unit:'v/d', higher:true },
      { icon:'😴', lbl:'Sueño (h/día)',   key:'sleep_avg', unit:'h',  higher:true },
      { icon:'⚡', lbl:'Energía (1-5)',   key:'energy',    unit:'⭐', higher:true }
    ]

    const metricsHtml = metrics.map(m => {
      const mv = myLog?.[m.key], tv = themLog?.[m.key]
      const myWins = mv != null && tv != null
        ? (m.higher ? mv > tv : mv < tv) : null
      return `<div class="metric-row">
        <div class="metric-icon">${m.icon}</div>
        <div class="metric-lbl">${m.lbl}</div>
        <div class="metric-vals">
          <div class="metric-val" style="color:${myWins===true?'#388E3C':myWins===false?'#C2185B':'var(--text)'}">${mv!=null?mv+' '+m.unit:'—'}</div>
          <div class="metric-winner">${myWins===true?'👑':myWins===false?'':''}</div>
          <div class="metric-val" style="color:${myWins===false?'#388E3C':myWins===true?'#C2185B':'var(--text)'}">${tv!=null?tv+' '+m.unit:'—'}</div>
        </div>
      </div>`
    }).join('')

    // Gráfica SVG de peso (últimas 8 semanas)
    const weightData = allWeeks.slice(0,8).reverse().map(w => ({
      w,
      my:   S.fitness.find(f => f.user_id===S.user    && f.week_start===w)?.weight || null,
      them: S.fitness.find(f => f.user_id===S.partner && f.week_start===w)?.weight || null
    }))
    const allWeights = weightData.flatMap(d => [d.my, d.them]).filter(v => v!=null)
    const minW = allWeights.length ? Math.min(...allWeights)-2 : 50
    const maxW = allWeights.length ? Math.max(...allWeights)+2 : 100
    const W = 300, H = 100, PAD = 10
    const xStep = allWeights.length > 1 ? (W - PAD*2) / (weightData.length-1) : W-PAD*2
    const yScale = v => PAD + (H-PAD*2) * (1 - (v-minW)/(maxW-minW))
    const ptsMy   = weightData.map((d,i) => d.my   != null ? `${PAD+i*xStep},${yScale(d.my)}`   : null).filter(Boolean)
    const ptsThem = weightData.map((d,i) => d.them != null ? `${PAD+i*xStep},${yScale(d.them)}` : null).filter(Boolean)

    const svgChart = allWeights.length >= 2 ? `
      <div class="sparkline-wrap">
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
          ${ptsMy.length>1?`<polyline points="${ptsMy.join(' ')}" fill="none" stroke="#3949AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}
          ${ptsThem.length>1?`<polyline points="${ptsThem.join(' ')}" fill="none" stroke="#C2185B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}
          ${ptsMy.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="#3949AB"/>`).join('')}
          ${ptsThem.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="#C2185B"/>`).join('')}
        </svg>
        <div style="display:flex;gap:16px;font-size:11px;margin-top:4px">
          <span style="color:#3949AB">● ${me.name}</span>
          <span style="color:#C2185B">● ${them.name}</span>
        </div>
      </div>` : `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:12px">Registren al menos 2 semanas para ver la gráfica</div>`

    document.getElementById('tab-content').innerHTML = `
      <div class="page">
        <div class="page-header"><div class="page-title">Cuerpo 💪</div></div>
        ${tabs}

        <!-- VS Esta semana -->
        <div class="grad-card">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;text-align:center;margin-bottom:8px">Reto físico — semana actual</div>
          <div class="fitness-vs">
            <div class="fitness-player">
              <div style="font-size:30px">${me.emoji}</div>
              <div class="fitness-score">${myFPts}</div>
              <div class="fitness-name">${me.name} ${myLeads&&myFPts>0?'👑':''}</div>
            </div>
            <div class="fitness-sep">VS</div>
            <div class="fitness-player">
              <div style="font-size:30px">${them.emoji}</div>
              <div class="fitness-score">${themFPts}</div>
              <div class="fitness-name">${them.name} ${!myLeads&&themFPts>0?'👑':''}</div>
            </div>
          </div>
          <div class="vs-banner">
            ${myFPts===0&&themFPts===0 ? '¡Registren esta semana para competir!' :
              myFPts===themFPts ? '¡Empate! ¿Quién rompe el tie?' :
              `${(myLeads?me:them).name} va ganando el reto físico 🔥`}
          </div>
        </div>

        <!-- Métricas comparativas -->
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div class="card-label" style="margin-bottom:0">COMPARATIVA ESTA SEMANA</div>
            <div style="font-size:12px;color:var(--text-muted)">${me.emoji} vs ${them.emoji}</div>
          </div>
          ${metricsHtml}
          <button class="btn-primary" style="margin-top:14px" onclick="openFitnessLog()">💪 Registrar mi semana</button>
        </div>

        <!-- Gráfica de peso -->
        <div class="card">
          <div class="card-label">EVOLUCIÓN DE PESO</div>
          ${svgChart}
        </div>

        <!-- Puntos: cómo se calculan -->
        <div class="card">
          <div class="card-label">¿CÓMO SE CALCULAN LOS PUNTOS?</div>
          <div class="metric-row"><div class="metric-icon">🏋️</div><div class="metric-lbl">Cada día de gym</div><div style="font-weight:700;color:var(--rose)">+10</div></div>
          <div class="metric-row"><div class="metric-icon">🏃</div><div class="metric-lbl">150+ min cardio/semana</div><div style="font-weight:700;color:var(--rose)">+15</div></div>
          <div class="metric-row"><div class="metric-icon">⚖️</div><div class="metric-lbl">Cada kg perdido vs semana ant.</div><div style="font-weight:700;color:var(--rose)">+8</div></div>
          <div class="metric-row"><div class="metric-icon">📏</div><div class="metric-lbl">Cada cm menos de cintura</div><div style="font-weight:700;color:var(--rose)">+25</div></div>
          <div class="metric-row"><div class="metric-icon">💪</div><div class="metric-lbl">Cada cm más de brazo</div><div style="font-weight:700;color:var(--rose)">+20</div></div>
          <div class="metric-row"><div class="metric-icon">💧</div><div class="metric-lbl">8+ vasos de agua/día</div><div style="font-weight:700;color:var(--rose)">+3/día</div></div>
          <div class="metric-row"><div class="metric-icon">😴</div><div class="metric-lbl">7+ horas de sueño/día</div><div style="font-weight:700;color:var(--rose)">+2/día</div></div>
        </div>
      </div>`
  }

  function weekStart() {
    const now = new Date(), d = now.getDay()
    const mon = new Date(now)
    mon.setDate(now.getDate() - (d === 0 ? 6 : d - 1))
    mon.setHours(0,0,0,0)
    return mon.toISOString().slice(0,10)
  }

            ${[...unlocked,...locked].map(a => `

                <div class="ach-desc">${a.desc}</div>
                ${a.unlocked ? `<div class="ach-date">✓ Desbloqueado</div>` : ''}
              </div>`).join('')}
          </div>
        </div>`
      return
    }

    if (sub === 'notas') {
      const myNotes   = S.notes.filter(n => n.to_user === S.user)
      const sentNotes = S.notes.filter(n => n.from_user === S.user)
      const notesHtml = myNotes.length === 0
        ? `<div class="empty"><div class="ei">💌</div><p>Aún no tienes notas secretas.<br>${CFG.USERS[S.partner].name} puede dejarte una.</p></div>`
        : myNotes.map(n => `
            <div class="note-card">
              <div class="note-ribbon">Para ti 💕</div>

          ${notesHtml}
          ${sentNotes.length>0?`<div class="card-label" style="margin-top:14px">TUS NOTAS ENVIADAS</div>${sentNotes.map(n=>`<div class="note-card"><div class="note-ribbon">Enviada</div><div class="note-msg">${n.message}</div><div class="note-from">${ago(n.created_at)}</div></div>`).join('')}`:''}

  }

  function buildAchievements() {

    const totalHabits = S.habits.length
    const totalSparks = S.sparks.length
    const totalMemories = S.memories.length
    const gymDaysAll = S.fitness.reduce((a,f) => a+(f.gym_days||0), 0)
    const weeksLogged = [...new Set(S.fitness.map(f => f.week_start))].length

    return [
      { icon:'💰', name:'Primer ahorro', desc:'Guardar por primera vez', unlocked: S.savings.length > 0 },
      { icon:'🎯', name:'$1,000 juntos',  desc:'Ahorrar $1,000 MXN entre los dos', unlocked: totalSaved >= 1000 },
      { icon:'✈️', name:'Rumbo a Europa', desc:'Ahorrar $10,000 MXN', unlocked: totalSaved >= 10000 },
      { icon:'🐾', name:'¡Perrito cerca!', desc:'Ahorrar $15,000 MXN para el perro', unlocked: goalTotal('perro') >= 15000 },
      { icon:'✅', name:'Primer hábito',  desc:'Registrar tu primer hábito', unlocked: totalHabits > 0 },
      { icon:'🔥', name:'Semana sana',    desc:'10+ hábitos en una semana', unlocked: (() => { const {mon,sun}=weekBounds(); return S.habits.filter(h=>new Date(h.created_at)>=mon&&new Date(h.created_at)<=sun).length>=10 })() },
      { icon:'💕', name:'Primer cariño', desc:'Mandarse el primer cariño', unlocked: totalSparks > 0 },
      { icon:'🌟', name:'Muy cariñosos', desc:'50+ cariños enviados entre los dos', unlocked: totalSparks >= 50 },
      { icon:'📸', name:'Primer recuerdo', desc:'Agregar su primera memoria al diario', unlocked: totalMemories > 0 },
      { icon:'📖', name:'Cronistas del amor', desc:'10+ recuerdos en el diario', unlocked: totalMemories >= 10 },
      { icon:'🏋️', name:'Primer gym',    desc:'Registrar la primera semana física', unlocked: S.fitness.length > 0 },
      { icon:'💪', name:'Constantes',    desc:'4 semanas registradas en CUERPO', unlocked: weeksLogged >= 4 },
      { icon:'🎯', name:'Primer reto',   desc:'Completar su primer reto semanal', unlocked: S.retos.some(r => r.completed && r.user_id === S.user) },
      { icon:'🎬', name:'Lista de sueños', desc:'Agregar 5+ pendientes juntos', unlocked: S.pending.length >= 5 },
      { icon:'🏆', name:'Completamos algo', desc:'Marcar un pendiente como "Fuimos/Vimos"', unlocked: S.pending.some(p=>p.status==='done') },
      { icon:'🪺', name:'Nido completo', desc:'Usar todas las secciones de la app', unlocked: S.savings.length>0&&S.habits.length>0&&S.plans.length>0&&S.fitness.length>0&&S.memories.length>0 }
    ]
  }

  /* ═══════════════════════════════════════════════════

  let _logType = 'ahorro'
  let _selHabits = []

  function openLog(type='ahorro') {
    _logType = type; _selHabits = []
    renderSheet()
    document.getElementById('sheet-wrap').classList.add('open')
  }

  function closeSheet() {
    document.getElementById('sheet-wrap').classList.remove('open')
  }

  function renderSheet() {
    document.getElementById('sheet-body').innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">¿Qué registras?</div>
      <div class="log-opts">
        <div class="log-opt ${_logType==='ahorro'?'sel':''}" onclick="setLogType('ahorro',this)">
          <div class="lo-icon">💰</div><div class="lo-name">Ahorro</div>
        </div>
        <div class="log-opt ${_logType==='habito'?'sel':''}" onclick="setLogType('habito',this)">
          <div class="lo-icon">✅</div><div class="lo-name">Hábito</div>
        </div>
      </div>
      <div id="log-form">${logForm()}</div>`
  }

  function setLogType(type, el) {
    _logType = type; _selHabits = []
    document.querySelectorAll('.log-opt').forEach(e => e.classList.remove('sel'))
    el.classList.add('sel')
    document.getElementById('log-form').innerHTML = logForm()
  }

  function logForm() {
    if (_logType === 'ahorro') return `
      <div class="form-group">
        <label class="form-label">Meta</label>
        <select class="form-select" id="lg-goal">
          <option value="europa">✈️ Viaje a Europa</option>
          <option value="perro">🐾 Nuestro perro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Cantidad (MXN)</label>
        <input type="number" class="form-input" id="lg-amount" placeholder="ej. 500" inputmode="decimal" />
      </div>
      <div class="form-group">
        <label class="form-label">Nota (opcional)</label>
        <input type="text" class="form-input" id="lg-note" placeholder="ej. Quincena" />
      </div>
      <button class="btn-primary" onclick="submitLog()">💰 Guardar ahorro</button>`

    if (_logType === 'habito') return `
      <div class="form-group">
        <label class="form-label">Selecciona los hábitos de hoy</label>
        <div class="habit-grid">
          ${CFG.HABITS.map(h => `
            <div class="habit-chip" id="hc-${h.id}" onclick="toggleH('${h.id}')">
              <div class="hc-icon">${h.icon}</div>
              <div class="hc-name">${h.name}</div>
            </div>`).join('')}
        </div>
      </div>
      <button class="btn-primary" id="hb-btn" onclick="submitLog()" disabled>✅ Guardar hábitos</button>`

    return ''
  }

  function toggleH(id) {
    const i = _selHabits.indexOf(id)
    if (i === -1) { _selHabits.push(id); document.getElementById(`hc-${id}`).classList.add('sel') }
    else          { _selHabits.splice(i,1); document.getElementById(`hc-${id}`).classList.remove('sel') }
    const btn = document.getElementById('hb-btn')
    if (btn) btn.disabled = _selHabits.length === 0
  }

  async function submitLog() {
    if (_logType === 'ahorro') {
      const amount = parseFloat(document.getElementById('lg-amount').value)
      if (!amount || amount <= 0) { toast('Ingresa una cantidad válida'); return }
      const goal_id = document.getElementById('lg-goal').value
      const note    = document.getElementById('lg-note').value
      await DB.saveSaving({ goal_id, amount, note })
      closeSheet()
      toast(`💰 $${fmt(amount)} guardados para ${CFG.GOALS[goal_id].name}!`, 'ok')
      renderCurrent()
      setTimeout(() => {
        const pts = Math.floor(amount/100)

  function showLoader(msg = 'Cargando Nido...') {
    document.getElementById('loading-screen').classList.remove('hidden')
    document.getElementById('loader-msg').textContent = msg
    document.getElementById('loader-retry').style.display = 'none'

  function showLoaderError(msg = 'Sin conexión') {
    document.getElementById('loader-msg').textContent = msg
    document.getElementById('loader-retry').style.display = 'block'
    document.getElementById('loading-screen').querySelector('.loader-spinner').style.display = 'none'
  }

  async function boot() {
    showLoader('Cargando Nido...')
    try {
      // Load saved Supabase config (localStorage overrides CFG defaults)
      const savedUrl = localStorage.getItem('nido_sb_url')
      const savedKey = localStorage.getItem('nido_sb_key')
      if (savedUrl && savedKey) {
        CFG.SUPABASE_URL = savedUrl
        CFG.SUPABASE_KEY = savedKey
      }
      // Always init Supabase with whatever credentials we have in CFG
      if (initSB()) RT.sub()

      // Load Claude API key from localStorage
      const savedClaudeKey = localStorage.getItem('nido_claude_key')
      if (savedClaudeKey) CFG.CLAUDE_API_KEY = savedClaudeKey
      await DB.loadAll()
      if (hasSB()) {
        // Auto-sync cada 30 segundos como respaldo al Realtime
        setInterval(async () => {
          await DB.loadAll()
          renderCurrent()
        }, 30000)
      }
      GCAL.loadToken()
      if (S.gcalToken) GCAL.fetchEvents()
      // Revisar cada 5 minutos si el token de Google está por expirar y renovarlo
      setInterval(() => GCAL.silentRefresh(), 5 * 60 * 1000)
      hideLoader()
      document.getElementById('app').style.display = 'block'
      renderHoy()
    } catch(e) {
      console.error('Boot error:', e)
      showLoaderError('Error al cargar — revisa tu conexión')
    }
  }

    const saved = localStorage.getItem('nido_user')
    if (saved && CFG.USERS[saved]) {
      S.user    = saved

  function weekBounds() {
    const now = new Date()
    const day = now.getDay() // 0=dom, 1=lun...
    const diff = (day === 0) ? -6 : 1 - day  // lunes como inicio
    const mon  = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff, 0, 0, 0)
    const sun  = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23, 59, 59)
    return { mon, sun }
  }

      icon, name,
      type:       _goalType,
      created_by: S.user,

      created_at: new Date().toISOString()

      goal.goal_desc = document.getElementById('ag-desc')?.value?.trim() || ''

  async function submitGoalProgress(goalId) {
    const g = S.goals.find(x => x.id === goalId)
    if (!g) return
    const val = parseFloat(document.getElementById('gp-val')?.value) || 0
    g.current = val
    if (g.target && val >= g.target) g.done = true
    DB._toLocal()
    if (hasSB()) await sb.from('nido_goals').update({ current: val, done: g.done }).eq('id', goalId)
    closeSheet()
    toast(`📊 Progreso actualizado: ${val} ${g.unit||''}`, 'ok')
    renderCurrent()
  }

  async function toggleGoalDone(goalId) {
    const g = S.goals.find(x => x.id === goalId)
    if (!g) return
    g.done = !g.done
    DB._toLocal()
    if (hasSB()) await sb.from('nido_goals').update({ done: g.done }).eq('id', goalId)
    closeSheet()
    toast(g.done ? '🏆 ¡Meta lograda! ¡Bien!' : '↩ Meta reabierta', g.done ? 'ok' : '')
    renderCurrent()
  }

  async function toggleCheckItem(goalId, idx, checked) {
    const g = S.goals.find(x => x.id === goalId)
    if (!g || !g.items) return
    g.items[idx].done = checked
    g.done = g.items.every(it => it.done)
    DB._toLocal()
    if (hasSB()) await sb.from('nido_goals').update({ items: JSON.stringify(g.items), done: g.done }).eq('id', goalId)
    // no re-render to keep the sheet open
  }

  /* ═══════════════════════════════════════════════════
     CLAUDE AI HELPER
  ═══════════════════════════════════════════════════ */
  async function callClaude(systemPrompt, userPrompt) {
    if (!CFG.CLAUDE_API_KEY || CFG.CLAUDE_API_KEY.startsWith('YOUR')) {
      throw new Error('CLAUDE_API_KEY no configurada')
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': CFG.CLAUDE_API_KEY,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 512,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    })
    if (!r.ok) {
      const err = await r.text()
      throw new Error(err)
    }
    const data = await r.json()
    return data.content[0].text.trim()
  }

            return `<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <span>${dc.emoji}</span>
              <div style="flex:1;font-size:12px;color:var(--text-muted);line-height:1.4">${u.emoji} ${r.challenge.slice(0,60)}${r.challenge.length>60?'…':''}</div>
              <div style="font-size:11px;font-weight:700;color:${dc.color}">+${dc.pts}</div>
            </div>`
          }).join('')}` : ''}
      </div>`
  }

  async function loadTopics(catId) {
    const cat = TOPIC_CATS.find(c => c.id === catId)
    if (!cat) return
    S.jugarLoading = true
    renderCurrent()
    try {
      const me   = CFG.USERS[S.user].name
      const them = CFG.USERS[S.partner].name
      const systemPrompt = `Eres el generador de temas de conversación para la app de pareja Nido.
Genera 3 preguntas profundas, interesantes y originales para la pareja formada por ${me} y ${them}.
Las preguntas deben ser en español, en segunda persona singular (tú), estimulantes y apropiadas para una pareja romántica.
Devuelve EXACTAMENTE 3 preguntas, una por línea, sin numeración, sin viñetas, sin explicaciones extra.`
      const categoryDescriptions = {
        conspira:   'teorías conspirativas, misterios sin resolver, cosas que el gobierno o medios ocultan, fenómenos extraños',
        espiritual: 'creencias sobre la vida después de la muerte, experiencias inexplicables, fe, dios, energía universal, sueños premonitorios',
        picante:    'preguntas atrevidas que generan tensión sexual, curiosidad íntima, fantasías y deseos entre la pareja, sin ser explícitas',
        futuro:     'planes de vida, miedos sobre el futuro, sueños que aún no han realizado, cómo se imaginan su vida en 10-20 años',
        conoceme:   'recuerdos de infancia, secretos que nunca han contado, miedos profundos, cosas que los definen y que la pareja quizá no sabe',
        dilemas:    'preguntas estilo ¿preferirías? con opciones difíciles e interesantes, situaciones hipotéticas que revelan personalidad',
      }
      const text = await callClaude(systemPrompt, `Categoría: ${categoryDescriptions[catId] || catId}`)
      const questions = text.split('\n').map(l => l.trim()).filter(l => l.length > 0).slice(0, 3)
      S.jugarTopics = [{ ...cat, questions }]
    } catch(e) {
      toast('⚠️ ' + (e.message.includes('CLAUDE_API_KEY') ? 'Ve a NIDO → Config → IA para configurar tu API key' : 'Error de IA — revisa tu API key en Config'), '')
      S.jugarTopics = []
    }
    S.jugarLoading = false
    renderCurrent()
  }

  async function openPickReto(difficulty) {
    if (!difficulty) {
      openSmartLog()
      return
    }
    const { mon } = weekBounds()
    const weekStr = mon.toISOString().split('T')[0]
    const existing = S.retos.find(r => r.user_id === S.user && r.week_start === weekStr)
    if (existing) { toast('Ya tienes un reto esta semana 🎯'); return }

    const diffConfig = { easy:'Fácil', medium:'Medio', hard:'Difícil' }
    const pts = { easy:5, medium:10, hard:20 }
    const me   = CFG.USERS[S.user]
    const them = CFG.USERS[S.partner]

    toast('✨ Generando tu reto...')

    try {
      const systemPrompt = `Eres el generador de retos románticos semanales para la app de pareja Nido.
Genera un reto ${diffConfig[difficulty]} para ${me.name}. El reto debe involucrar hacer algo especial para su pareja ${them.name}.
REGLAS:
- Una sola frase directa en español, empezando con un verbo de acción (ej: "Escríbele", "Prepara", "Sorprende")
- Nivel ${diffConfig[difficulty]}: ${difficulty === 'easy' ? 'algo sencillo, 5-10 min de esfuerzo' : difficulty === 'medium' ? 'algo que requiere planificación o tiempo' : 'algo memorable, significativo y que requiere esfuerzo real'}
- Sin explicaciones, solo el reto
- Máximo 20 palabras`
      const challenge = await callClaude(systemPrompt, `Genera el reto de nivel ${diffConfig[difficulty]} para esta semana`)
      const reto = {
        id:         crypto.randomUUID(),
        user_id:    S.user,
        week_start: weekStr,
        difficulty,
        challenge,
        completed:  false,
        points:     pts[difficulty],
        created_at: new Date().toISOString()
      }
      S.retos.unshift(reto)
      DB._toLocal()
      if (hasSB()) await sb.from('nido_retos').insert(reto)
      toast(`🎯 ¡Reto ${diffConfig[difficulty]} asignado!`, 'ok')
      renderCurrent()
    } catch(e) {
      toast('⚠️ ' + (e.message.includes('CLAUDE_API_KEY') ? 'Ve a NIDO → Config → IA para configurar tu API key' : 'Error generando reto'), '')
    }
  }

  async function completeReto(retoId) {
    const idx = S.retos.findIndex(r => r.id === retoId)
    if (idx < 0) return
    S.retos[idx].completed = true
    DB._toLocal()
    if (hasSB()) await sb.from('nido_retos').update({ completed: true }, 'id', retoId)
    const pts = { easy:5, medium:10, hard:20 }[S.retos[idx].difficulty] || 5
    toast(`🎉 ¡Reto completado! +${pts} puntos`, 'ok')
    renderCurrent()
  }

  /* ═══════════════════════════════════════════════════
     AGENDA — FILTRO POR DÍA
  ═══════════════════════════════════════════════════ */
  let _agendaFilter = null

  function filterAgendaDay(dateStr) {
    _agendaFilter = (_agendaFilter === dateStr) ? null : dateStr
    renderVida()
  }

  init()
  </script>
</body>
